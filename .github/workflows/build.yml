name: Build CloudStream plugin

on:
  push:
    branches: [main, master]
    paths-ignore: ["*.md"]
  workflow_dispatch:

concurrency:
  group: cloudstream-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: src
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Build plugin and repository index
        working-directory: src
        run: gradle --no-daemon make makePluginsJson
      - name: Publish build artifacts
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          find "$GITHUB_WORKSPACE/src" -path '*/build/*.cs3' -exec cp {} "$GITHUB_WORKSPACE/output/" \;
          cp "$GITHUB_WORKSPACE/src/build/plugins.json" "$GITHUB_WORKSPACE/output/plugins.json"
          test -n "$(find "$GITHUB_WORKSPACE/output" -maxdepth 1 -name '*.cs3' -print -quit)"
          cd "$GITHUB_WORKSPACE/src"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan builds
          git rm -rf .
          git clean -fdx
          cp "$GITHUB_WORKSPACE/output"/* .
          git add .
          git commit -m "Build $GITHUB_SHA"
          git push origin builds --force
